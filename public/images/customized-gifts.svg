<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="giftBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </radialGradient>
    <linearGradient id="crystalBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fae8ff" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#fdf2f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f5d0fe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="35%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldCalligraphy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="blockShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#86198f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#giftBg)"/>

  <!-- Solid Wood LED Light Stand Base -->
  <rect x="150" y="420" width="300" height="40" rx="8" fill="url(#woodBase)"/>
  <!-- Warm LED Channel Glow -->
  <rect x="190" y="415" width="220" height="8" rx="4" fill="#fde047" opacity="0.9"/>

  <!-- Crystal Hexagon Keepsake Block -->
  <g filter="url(#blockShadow)">
    <!-- Hexagon Shape (8-inch preservation block) -->
    <polygon points="300,90 440,170 440,350 300,430 160,350 160,170" 
             fill="url(#crystalBlock)" 
             stroke="#ffffff" 
             stroke-width="5"/>

    <!-- 3D Beveled Top Glass Facet -->
    <polygon points="300,105 425,178 425,340 300,415 175,340 175,178" 
             fill="none" 
             stroke="#ffffff" 
             stroke-width="2" 
             opacity="0.7"/>

    <!-- Preserved Wedding Varmala Garland Red Roses & Florals inside -->
    <!-- Center Grand Red Rose -->
    <circle cx="300" cy="245" r="38" fill="#be123c"/>
    <circle cx="300" cy="245" r="28" fill="#e11d48"/>
    <circle cx="300" cy="245" r="16" fill="#fb7185"/>
    <circle cx="300" cy="245" r="7" fill="#881337"/>
    <!-- Petal curves -->
    <path d="M280 230 Q300 215, 320 230" stroke="#fecdd3" stroke-width="2.5" fill="none"/>
    <path d="M275 255 Q300 275, 325 255" stroke="#fecdd3" stroke-width="2.5" fill="none"/>

    <!-- Surrounding Jasmine / Mogra Buds & Baby's Breath -->
    <circle cx="240" cy="210" r="10" fill="#ffffff"/>
    <circle cx="230" cy="260" r="9" fill="#fef08a"/>
    <circle cx="360" cy="210" r="10" fill="#ffffff"/>
    <circle cx="370" cy="260" r="9" fill="#fef08a"/>
    <circle cx="255" cy="300" r="8" fill="#ffffff"/>
    <circle cx="345" cy="300" r="8" fill="#ffffff"/>

    <!-- Green Leaves & Ferns -->
    <ellipse cx="230" cy="180" rx="14" ry="7" transform="rotate(-40 230 180)" fill="#15803d"/>
    <ellipse cx="370" cy="180" rx="14" ry="7" transform="rotate(40 370 180)" fill="#15803d"/>

    <!-- Floating 24K Gold Foil Flakes -->
    <polygon points="275,150 282,143 286,155 278,157" fill="url(#goldCalligraphy)"/>
    <polygon points="325,155 332,148 335,160 328,162" fill="url(#goldCalligraphy)"/>
    <polygon points="220,335 228,328 230,340 223,342" fill="url(#goldCalligraphy)"/>
    <polygon points="370,335 378,328 382,340 374,342" fill="url(#goldCalligraphy)"/>
    <circle cx="210" cy="230" r="4" fill="#fef08a"/>
    <circle cx="390" cy="230" r="4" fill="#fef08a"/>

    <!-- Engraved Gold Calligraphy (Wedding Keepsake) -->
    <text x="300" y="345" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="url(#goldCalligraphy)" text-anchor="middle">Ananya &amp; Kabir</text>
    <text x="300" y="370" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#a21caf" text-anchor="middle" letter-spacing="2">24 • 11 • 2026</text>
  </g>

  <text x="300" y="525" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#701a75" text-anchor="middle" letter-spacing="2">WEDDING VARMALA PRESERVATION</text>
  <text x="300" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#a21caf" text-anchor="middle" letter-spacing="3">HEXAGON HEIRLOOM BLOCK • LED LIGHT BASE</text>
</svg>
