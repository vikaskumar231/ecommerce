<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="slBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </radialGradient>
    <radialGradient id="vermilionResin" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="80%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="slShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7f1d1d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#slBg)"/>

  <!-- Left Piece: SHUBH (शुभ) -->
  <g filter="url(#slShadow)">
    <!-- Outer 24K Gilded Resin Edge -->
    <circle cx="190" cy="270" r="115" fill="none" stroke="url(#richGold)" stroke-width="8"/>
    <!-- Deep Crimson Vermilion Resin Core -->
    <circle cx="190" cy="270" r="111" fill="url(#vermilionResin)"/>
    <!-- Specular Highlight Curve -->
    <path d="M110 230 A 100 100 0 0 1 270 230" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
    
    <!-- Gold leaf flakes floating inside -->
    <circle cx="150" cy="200" r="4" fill="#fef08a"/>
    <circle cx="230" cy="210" r="5" fill="#fef08a"/>
    <circle cx="130" cy="280" r="3.5" fill="#fef08a"/>
    <circle cx="245" cy="290" r="4" fill="#fef08a"/>
    <circle cx="170" cy="340" r="4.5" fill="#fef08a"/>
    <circle cx="220" cy="335" r="3.5" fill="#fef08a"/>

    <!-- Sanskrit Devanagari Calligraphy 'शुभ' (Shubh) -->
    <text x="190" y="285" font-family="'Rozha One', 'Noto Serif Devanagari', serif" font-size="52" font-weight="700" fill="url(#richGold)" text-anchor="middle">शुभ</text>
    <text x="190" y="315" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="3">SHUBH</text>

    <!-- Bottom Gold Pearl Tassel -->
    <circle cx="190" cy="385" r="5" fill="url(#richGold)"/>
    <line x1="190" y1="390" x2="190" y2="440" stroke="url(#richGold)" stroke-width="3"/>
    <circle cx="190" cy="445" r="7" fill="url(#richGold)"/>
  </g>

  <!-- Right Piece: LABH (लाभ) -->
  <g filter="url(#slShadow)">
    <!-- Outer 24K Gilded Resin Edge -->
    <circle cx="410" cy="270" r="115" fill="none" stroke="url(#richGold)" stroke-width="8"/>
    <!-- Deep Crimson Vermilion Resin Core -->
    <circle cx="410" cy="270" r="111" fill="url(#vermilionResin)"/>
    <!-- Specular Highlight Curve -->
    <path d="M330 230 A 100 100 0 0 1 490 230" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
    
    <!-- Gold leaf flakes floating inside -->
    <circle cx="370" cy="200" r="4" fill="#fef08a"/>
    <circle cx="450" cy="210" r="5" fill="#fef08a"/>
    <circle cx="350" cy="280" r="3.5" fill="#fef08a"/>
    <circle cx="465" cy="290" r="4" fill="#fef08a"/>
    <circle cx="390" cy="340" r="4.5" fill="#fef08a"/>
    <circle cx="440" cy="335" r="3.5" fill="#fef08a"/>

    <!-- Sanskrit Devanagari Calligraphy 'लाभ' (Labh) -->
    <text x="410" y="285" font-family="'Rozha One', 'Noto Serif Devanagari', serif" font-size="52" font-weight="700" fill="url(#richGold)" text-anchor="middle">लाभ</text>
    <text x="410" y="315" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="3">LABH</text>

    <!-- Bottom Gold Pearl Tassel -->
    <circle cx="410" cy="385" r="5" fill="url(#richGold)"/>
    <line x1="410" y1="390" x2="410" y2="440" stroke="url(#richGold)" stroke-width="3"/>
    <circle cx="410" cy="445" r="7" fill="url(#richGold)"/>
  </g>

  <text x="300" y="525" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#7f1d1d" text-anchor="middle" letter-spacing="2">AUSPICIOUS SHUBH LABH HANGINGS</text>
  <text x="300" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle" letter-spacing="3">SINDOOR RED RESIN • 24K GOLD LEAF</text>
</svg>
