<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f7f1e6"/>
      <stop offset="100%" stop-color="#ebe0ce"/>
    </linearGradient>
    <radialGradient id="resinTeal" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0f766e" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#115e59" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </radialGradient>
    <radialGradient id="resinBlush" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f4c5c" flood-opacity="0.25"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <circle cx="300" cy="300" r="240" fill="#ffffff" opacity="0.6"/>

  <!-- Gold Hanging French Wire Hooks -->
  <!-- Left Earring Hook -->
  <path d="M220 80 C220 50, 200 40, 185 60 C170 80, 190 120, 190 160" fill="none" stroke="url(#goldLeaf)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="190" cy="165" r="5" fill="url(#goldLeaf)"/>
  
  <!-- Right Earring Hook -->
  <path d="M410 80 C410 50, 390 40, 375 60 C360 80, 380 120, 380 160" fill="none" stroke="url(#goldLeaf)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="380" cy="165" r="5" fill="url(#goldLeaf)"/>

  <!-- Left Drop Resin Earring -->
  <g filter="url(#dropShadow)">
    <!-- Teardrop body -->
    <path d="M190 170 C240 270, 260 380, 190 450 C120 380, 140 270, 190 170 Z" fill="url(#resinTeal)"/>
    <!-- Translucent glass gloss shine layer -->
    <path d="M185 185 C220 270, 230 350, 175 420 C145 360, 150 270, 185 185 Z" fill="#ffffff" opacity="0.25"/>
    <!-- Specular highlight streak -->
    <ellipse cx="165" cy="300" rx="10" ry="60" transform="rotate(-15 165 300)" fill="#ffffff" opacity="0.5"/>
    <!-- 24K Gold leaf foil floating inclusions -->
    <path d="M180 280 Q195 270, 205 290 Q190 310, 180 280 Z" fill="url(#goldLeaf)" filter="url(#goldGlow)"/>
    <path d="M165 340 Q180 325, 195 350 Q175 365, 165 340 Z" fill="url(#goldLeaf)"/>
    <path d="M195 380 Q210 375, 205 395 Q190 405, 195 380 Z" fill="url(#goldLeaf)"/>
    <circle cx="160" cy="250" r="3" fill="#fef08a"/>
    <circle cx="210" cy="330" r="4" fill="#fef08a"/>
    <circle cx="180" cy="420" r="3.5" fill="#fef08a"/>
  </g>

  <!-- Right Drop Resin Earring -->
  <g filter="url(#dropShadow)">
    <!-- Teardrop body -->
    <path d="M380 170 C430 270, 450 380, 380 450 C310 380, 330 270, 380 170 Z" fill="url(#resinBlush)"/>
    <!-- Translucent glass gloss layer -->
    <path d="M375 185 C410 270, 420 350, 365 420 C335 360, 340 270, 375 185 Z" fill="#ffffff" opacity="0.3"/>
    <!-- Specular highlight streak -->
    <ellipse cx="355" cy="300" rx="10" ry="60" transform="rotate(-15 355 300)" fill="#ffffff" opacity="0.55"/>
    <!-- Botanical Pressed Flower Inclusions -->
    <circle cx="380" cy="320" r="8" fill="#fef08a"/>
    <path d="M380 305 Q375 290, 385 290 Q385 305, 380 305 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M380 335 Q375 350, 385 350 Q385 335, 380 335 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M365 320 Q350 315, 350 325 Q365 325, 365 320 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M395 320 Q410 315, 410 325 Q395 325, 395 320 Z" fill="#ffffff" opacity="0.9"/>
    <!-- 24K Gold Leaf inclusions -->
    <path d="M360 260 Q375 250, 385 270 Q370 285, 360 260 Z" fill="url(#goldLeaf)" filter="url(#goldGlow)"/>
    <path d="M375 370 Q395 360, 405 385 Q385 400, 375 370 Z" fill="url(#goldLeaf)"/>
    <circle cx="355" cy="390" r="3" fill="#fef08a"/>
    <circle cx="400" cy="290" r="4" fill="#fef08a"/>
  </g>

  <!-- Elegant Brand Tag Watermark -->
  <text x="300" y="530" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#0f4c5c" text-anchor="middle" letter-spacing="2">ARTISAN RESIN EARRINGS</text>
  <text x="300" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#c59b63" text-anchor="middle" letter-spacing="3">100% HANDCRAFTED • 24K GOLD FOIL</text>
</svg>
