<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="festiveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <radialGradient id="lotusPink" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="marigoldOrange" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <linearGradient id="braidedGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="festiveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#991b1b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#festiveBg)"/>

  <!-- Top Braided Gold Hanging Cord with End Loops -->
  <path d="M40 140 Q300 170, 560 140" stroke="url(#braidedGold)" stroke-width="8" fill="none"/>
  <circle cx="45" cy="140" r="10" fill="none" stroke="url(#braidedGold)" stroke-width="5"/>
  <circle cx="555" cy="140" r="10" fill="none" stroke="url(#braidedGold)" stroke-width="5"/>

  <!-- 3D Resin Sacred Lotus & Marigold Drops along Toran -->
  
  <!-- Left Drop: Marigold Medallion -->
  <g filter="url(#festiveGlow)">
    <line x1="130" y1="150" x2="130" y2="230" stroke="url(#braidedGold)" stroke-width="3"/>
    <circle cx="130" cy="270" r="42" fill="url(#marigoldOrange)"/>
    <!-- Petal details -->
    <circle cx="130" cy="270" r="28" fill="#fde047" opacity="0.8"/>
    <circle cx="130" cy="270" r="12" fill="#ca8a04"/>
    <!-- Hanging Brass Bell -->
    <path d="M124 330 L136 330 L140 350 L120 350 Z" fill="url(#braidedGold)"/>
    <circle cx="130" cy="355" r="4" fill="url(#braidedGold)"/>
  </g>

  <!-- Center Drop: Grand Hand-Poured Resin Lotus -->
  <g filter="url(#festiveGlow)">
    <line x1="300" y1="160" x2="300" y2="210" stroke="url(#braidedGold)" stroke-width="4"/>
    <!-- Lotus Plaque -->
    <circle cx="300" cy="280" r="65" fill="#ffffff" stroke="url(#braidedGold)" stroke-width="4"/>
    <!-- Lotus Petals in Resin -->
    <path d="M300 230 C280 250, 275 280, 300 310 C325 280, 320 250, 300 230 Z" fill="url(#lotusPink)"/>
    <path d="M275 250 C250 270, 255 295, 285 305 C295 285, 290 265, 275 250 Z" fill="url(#lotusPink)" opacity="0.9"/>
    <path d="M325 250 C350 270, 345 295, 315 305 C305 285, 310 265, 325 250 Z" fill="url(#lotusPink)" opacity="0.9"/>
    <circle cx="300" cy="290" r="8" fill="url(#braidedGold)"/>
    <!-- Center Gold Inscription -->
    <text x="300" y="325" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">SHUBH</text>
    <!-- Three Tier Brass Ghungroo Bells -->
    <line x1="300" y1="345" x2="300" y2="400" stroke="url(#braidedGold)" stroke-width="3"/>
    <path d="M292 400 L308 400 L314 425 L286 425 Z" fill="url(#braidedGold)"/>
    <circle cx="300" cy="432" r="5" fill="url(#braidedGold)"/>
  </g>

  <!-- Right Drop: Marigold Medallion -->
  <g filter="url(#festiveGlow)">
    <line x1="470" y1="150" x2="470" y2="230" stroke="url(#braidedGold)" stroke-width="3"/>
    <circle cx="470" cy="270" r="42" fill="url(#marigoldOrange)"/>
    <circle cx="470" cy="270" r="28" fill="#fde047" opacity="0.8"/>
    <circle cx="470" cy="270" r="12" fill="#ca8a04"/>
    <!-- Hanging Brass Bell -->
    <path d="M464 330 L476 330 L480 350 L460 350 Z" fill="url(#braidedGold)"/>
    <circle cx="470" cy="355" r="4" fill="url(#braidedGold)"/>
  </g>

  <text x="300" y="525" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="2">FESTIVE ENTRANCE TORAN</text>
  <text x="300" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#ea580c" text-anchor="middle" letter-spacing="3">HANDCRAFTED LOTUS • BRASS BELLS • EVERGREEN</text>
</svg>
